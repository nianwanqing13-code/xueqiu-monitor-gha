name: 抓取诊断（临时，验证完即删）

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 注入 cookie
        env:
          XUEQIU_COOKIES: ${{ secrets.XUEQIU_COOKIES }}
        run: |
          mkdir -p xueqiu_sub
          printf '%s' "$XUEQIU_COOKIES" > xueqiu_sub/cookies.json

      - name: 多端点探测
        run: |
          COOKIE=$(node -e "const c=require('./xueqiu_sub/cookies.json');console.log(c.filter(x=>String(x.domain).includes('xueqiu')).map(x=>x.name+'='+x.value).join('; '))")
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          probe() {
            echo "--- $1"
            curl -s -o r.txt -w "    code=%{http_code} size=%{size_download} redirect=%{redirect_url}\n" --max-time 20 \
              -H "Cookie: $COOKIE" -H "User-Agent: $UA" -H "X-Requested-With: XMLHttpRequest" "$1" || echo "    (curl 失败)"
            head -c 160 r.txt; echo ""
          }
          Q="user_id=3058599833&page=1&size=20&type=status"
          probe "https://xueqiu.com/statuses/user_timeline.json?$Q"
          probe "https://www.xueqiu.com/statuses/user_timeline.json?$Q"
          probe "https://api.xueqiu.com/statuses/user_timeline.json?$Q"
          probe "https://xueqiu.com/v4/statuses/user_timeline.json?$Q"
          probe "https://stock.xueqiu.com/v5/stock/quote.json?symbol=SH600519&extend=detail"
          echo "--- 带 Referer"
          curl -s -o r.txt -w "    code=%{http_code} size=%{size_download} redirect=%{redirect_url}\n" --max-time 20 \
            -H "Cookie: $COOKIE" -H "User-Agent: $UA" -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://xueqiu.com/u/3058599833" \
            "https://xueqiu.com/statuses/user_timeline.json?$Q" || true
          head -c 160 r.txt; echo ""
          echo "--- HTTP/1.1"
          curl -s --http1.1 -o r.txt -w "    code=%{http_code} size=%{size_download} redirect=%{redirect_url}\n" --max-time 20 \
            -H "Cookie: $COOKIE" -H "User-Agent: $UA" -H "X-Requested-With: XMLHttpRequest" \
            "https://xueqiu.com/statuses/user_timeline.json?$Q" || true
          head -c 160 r.txt; echo ""
