name: 抓取诊断（临时，验证完即删）

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 注入 cookie
        env:
          XUEQIU_COOKIES: ${{ secrets.XUEQIU_COOKIES }}
        run: |
          mkdir -p xueqiu_sub
          printf '%s' "$XUEQIU_COOKIES" > xueqiu_sub/cookies.json

      - name: 正式抓取脚本验证（云端）
        run: |
          echo "=== 出口 IP ==="
          curl -s --max-time 20 https://api.ipify.org || echo "(失败)"
          echo ""
          echo "=== node fetch_xueqiu_http.mjs 结果 ==="
          node fetch_xueqiu_http.mjs > out.json 2>err.txt || true
          node -e "const j=require('./out.json');console.log('ok =',j.ok);console.log('count =',j.count||0);console.log('reason =',j.reason||'-');if(j.posts&&j.posts.length){console.log('最新一条 =',j.posts[0].time_cst);console.log('正文前80字 =',String(j.posts[0].text).slice(0,80));}" 2>/dev/null || (echo "解析失败，原始输出：" && head -c 400 out.json)
          echo ""
          echo "=== stderr ==="
          head -c 300 err.txt
