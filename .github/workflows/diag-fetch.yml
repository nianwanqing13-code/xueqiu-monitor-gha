name: 抓取诊断（临时，验证完即删）

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 注入 cookie
        env:
          XUEQIU_COOKIES: ${{ secrets.XUEQIU_COOKIES }}
        run: |
          mkdir -p xueqiu_sub
          printf '%s' "$XUEQIU_COOKIES" > xueqiu_sub/cookies.json
          echo "cookie 字节数: $(wc -c < xueqiu_sub/cookies.json)"

      - name: 纯 HTTP 抓取测试（云 IP 是否被 WAF 拦截）
        run: |
          echo "=== 出口 IP ==="
          curl -s --max-time 20 https://api.ipify.org || echo "(取 IP 失败)"
          echo ""
          echo "=== 纯 HTTP 抓取结果 ==="
          node fetch_xueqiu_http.mjs > result.json 2>err.txt || true
          head -c 700 result.json
          echo ""
          echo "=== stderr ==="
          head -c 400 err.txt
          echo ""
          echo "=== 原始响应探测（判断是否 WAF 挑战页）==="
          COOKIE=$(node -e "const c=require('./xueqiu_sub/cookies.json');console.log(c.filter(x=>String(x.domain).includes('xueqiu')).map(x=>x.name+'='+x.value).join('; '))")
          curl -s --max-time 25 -o raw.txt -w "HTTP状态码: %{http_code}\n" \
            -H "Cookie: $COOKIE" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "X-Requested-With: XMLHttpRequest" \
            "https://xueqiu.com/statuses/user_timeline.json?user_id=3058599833&page=1&size=20&type=status"
          echo "响应前 300 字节:"
          head -c 300 raw.txt
