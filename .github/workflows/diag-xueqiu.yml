name: 诊断·雪球连通性（临时）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 注入 cookie
        env:
          XUEQIU_COOKIES: ${{ secrets.XUEQIU_COOKIES }}
        run: |
          mkdir -p xueqiu_sub
          printf '%s' "$XUEQIU_COOKIES" > xueqiu_sub/cookies.json
          echo "cookie bytes: $(wc -c < xueqiu_sub/cookies.json)" | tee diag_result.txt

      - name: 纯 HTTP 探测（主域 vs www）+ 浏览器路径
        run: |
          set +e
          CK=$(node -e "const c=require('./xueqiu_sub/cookies.json');const m=new Map();for(const x of c){if(String(x.domain).includes('xueqiu'))m.set(x.name,x.value)}console.log([...m].map(([k,v])=>k+'='+v).join('; '))")
          {
            echo "== runner IP =="
            curl -s --max-time 10 https://api.ipify.org; echo
            echo "== cookie names =="
            node -e "const c=require('./xueqiu_sub/cookies.json');console.log(c.map(x=>x.name).join(','))"
            echo "== xq_is_login present =="
            node -e "const c=require('./xueqiu_sub/cookies.json');const f=c.find(x=>x.name==='xq_is_login');console.log(f?('yes value='+f.value):'no')"
            UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            for HOST in xueqiu.com www.xueqiu.com; do
              echo "== HTTP $HOST =="
              code=$(curl -s -o /tmp/b.txt -w '%{http_code}' -A "$UA" -H "Cookie: $CK" \
                -H 'X-Requested-With: XMLHttpRequest' -H 'Accept: application/json' --max-time 25 \
                "https://$HOST/statuses/user_timeline.json?user_id=3058599833&page=1&size=20&type=status")
              echo "status=$code"
              head -c 300 /tmp/b.txt; echo
            done
            echo "== browser path =="
            npm i playwright@1.61.1 --no-audit --no-fund >/dev/null 2>&1
            npx playwright install chromium >/dev/null 2>&1
            timeout 200 node fetch_xueqiu.mjs 2>&1 | head -12
          } >> diag_result.txt

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag_result.txt
          git diff --cached --quiet || { git commit -q -m "diag: runner 侧雪球连通性结果 [skip ci]"; git push -q; }
